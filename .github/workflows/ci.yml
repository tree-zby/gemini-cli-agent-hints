name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build
      - run: node --test tests/*.test.js

  # The host patch is verified against a real Gemini CLI checkout on demand:
  # the upstream clone is too heavy for every push, and the local record lives in
  # e2e/evidence/gemini-seam.json plus docs/protocol-compliance.md.
  patch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch to the pinned upstream commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/google-gemini/gemini-cli /tmp/gemini-cli
          cd /tmp/gemini-cli
          git fetch --depth 1 origin 60f8082
          git checkout FETCH_HEAD -- .
          git apply --check "$GITHUB_WORKSPACE/patches/0001-before-model-http-headers.patch"
          echo "patch applies to 60f8082"
